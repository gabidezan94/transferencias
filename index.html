<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Transferirme | Gabriel</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#202124;background:#f5f7fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px}.card{width:min(100%,430px);background:white;border-radius:24px;padding:32px 24px;box-shadow:0 12px 40px #17294b15;text-align:center}.icon{display:inline-grid;place-items:center;background:#e7f8ef;border-radius:18px;width:66px;height:66px;font-size:32px}h1{font-size:25px;margin:18px 0 10px}p{line-height:1.5;color:#596271}.alias{background:#f4f6f8;border:1px solid #e4e8ee;border-radius:14px;padding:18px 8px;margin:25px 0 15px;overflow-wrap:anywhere}.alias small{display:block;color:#657080;margin-bottom:6px}.alias strong{font-size:22px}button{background:#1565d8;color:white;border:0;border-radius:12px;padding:16px;width:100%;font-size:17px;font-weight:700;cursor:pointer}button:focus-visible{outline:3px solid #80b8ff;outline-offset:3px}.notice{min-height:24px;font-size:14px;margin-top:12px;color:#147445}.hint{font-size:13px;margin-top:15px}
</style>
</head><body><main class="card"><div class="icon" aria-hidden="true">↗</div><h1>Transferencia bancaria</h1><p>Copiá el alias y pegalo en la opción <strong>Transferir</strong> de tu banco o billetera virtual.</p><div class="alias"><small>Alias de Mercado Pago</small><strong id="alias">gabrieldezan.mp</strong></div><button id="copy" type="button">Copiar alias</button><div class="notice" id="notice" role="status" aria-live="polite"></div><p class="hint">Antes de confirmar, verificá que el destinatario sea el correcto en tu aplicación.</p></main>
<script>
const alias='gabrieldezan.mp';document.getElementById('copy').addEventListener('click',async()=>{const msg=document.getElementById('notice');try{await navigator.clipboard.writeText(alias);msg.textContent='✓ Alias copiado. Abrí tu banco o billetera para transferir.'}catch(e){const field=document.createElement('textarea');field.value=alias;field.style.position='fixed';field.style.opacity='0';document.body.appendChild(field);field.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}field.remove();msg.textContent=ok?'✓ Alias copiado.':'No se pudo copiar automáticamente. Mantené presionado el alias para copiarlo.'}});
</script></body></html>
